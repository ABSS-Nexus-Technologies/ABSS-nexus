<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Catalog Management | ABSS Nexus Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/public/assets/images/favicon-32x32.png" />
  <link rel="stylesheet" href="/src/styles/styles.css?v=20261023v2" />
  <style>
    .admin-tasks-wrapper {
      max-width: 1040px;
      margin: 40px auto 80px;
      padding: 0 20px;
      color: #1D1D1F;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #E5E7EB;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }
    .task-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #E5E7EB;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .task-table th, .task-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #E5E7EB;
      font-size: 14px;
    }
    .task-table th {
      background: #F9FAFB;
      font-weight: 700;
      color: #4B5563;
    }
    .btn-create {
      background: #0066CC;
      color: #ffffff;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-create:hover { background: #0052A3; }
    .btn-action-sm {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #D1D5DB;
      background: #ffffff;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 28px;
      max-width: 560px;
      width: 100%;
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 14px; box-sizing: border-box;
    }
  </style>
</head>
<body class="agency-dark-theme">
  <header class="site-header site-header--academy" role="banner">
    <nav class="nav" aria-label="Internship Academy Navigation">
      <a class="brand" href="/admin" aria-label="ABSS Nexus Academy home">
        <img src="/public/assets/images/favicon.png" alt="ABSS Nexus logo" width="38" height="38" />
        <div class="brand-text-group" style="display: flex; flex-direction: column; text-align: left;">
          <span class="brand-name">ABSS Nexus Admin</span>
          <span class="brand-subtext" style="font-size: 0.72rem; color: #6E6E73; font-weight: 500;">Task Catalog Manager</span>
        </div>
      </a>
      <div class="nav-links">
        <a href="/admin/submissions" class="nav-link">Teacher Reviews</a>
        <a href="/admin" class="nav-link">Admin Dashboard</a>
      </div>
    </nav>
  </header>

  <main class="admin-tasks-wrapper">
    <div class="header-bar">
      <div>
        <h1 style="margin: 0; font-size: 24px;">Curriculum Tasks Catalog</h1>
        <p style="margin: 4px 0 0; color: #6B7280; font-size: 14px;">Manage engineering milestones, add new weekly challenges, and adjust scoring criteria.</p>
      </div>
      <button type="button" class="btn-create" onclick="openCreateModal()">+ Add New Task</button>
    </div>

    <div style="margin-bottom: 16px;">
      <select id="filter-track" class="form-select" style="max-width: 260px;" onchange="loadTasks()">
        <option value="">All Tracks</option>
        <option value="web-development">Web Development</option>
        <option value="data-science">Data Science</option>
        <option value="cloud-devops">Cloud & DevOps</option>
        <option value="ai-machine-learning">AI & Machine Learning</option>
        <option value="ui-ux-design">UI/UX Design</option>
      </select>
    </div>

    <table class="task-table">
      <thead>
        <tr>
          <th>Week</th>
          <th>Track</th>
          <th>Title &amp; Description</th>
          <th>Duration</th>
          <th>Points</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tasks-tbody">
        <tr><td colspan="6" style="text-align: center; color: #6B7280;">Loading tasks...</td></tr>
      </tbody>
    </table>
  </main>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="task-modal" style="display: none;">
    <div class="modal-box">
      <h2 id="modal-title" style="margin-top: 0; font-size: 20px;">Add New Milestone Task</h2>
      <input type="hidden" id="edit-task-id" />

      <div class="form-group">
        <label class="form-label">Engineering Track *</label>
        <select id="modal-track" class="form-select">
          <option value="web-development">Web Development</option>
          <option value="data-science">Data Science</option>
          <option value="cloud-devops">Cloud & DevOps</option>
          <option value="ai-machine-learning">AI & Machine Learning</option>
          <option value="ui-ux-design">UI/UX Design</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Week Number (1-8) *</label>
        <input type="number" id="modal-week" class="form-input" min="1" max="8" value="1" required />
      </div>

      <div class="form-group">
        <label class="form-label">Duration Scope *</label>
        <select id="modal-duration" class="form-select">
          <option value="both">Both (Low & High Duration)</option>
          <option value="high">High Duration Only (Weeks 5-8)</option>
          <option value="low">Low Duration Only</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Task Title *</label>
        <input type="text" id="modal-task-title" class="form-input" placeholder="e.g. Dynamic JavaScript DOM Project" required />
      </div>

      <div class="form-group">
        <label class="form-label">Detailed Description &amp; Deliverables *</label>
        <textarea id="modal-desc" class="form-textarea" rows="4" placeholder="Detail milestone goals, submission expectations, and evaluation points..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Max Points (Default 10)</label>
        <input type="number" id="modal-points" class="form-input" value="10" />
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
        <button type="button" class="btn-action-sm" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn-create" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>

  <script>
    async function loadTasks() {
      const track = document.getElementById('filter-track').value;
      const url = track ? `/api/admin/tasks?track=${track}` : '/api/admin/tasks';

      try {
        const res = await fetch(url);
        const data = await res.json();
        const tbody = document.getElementById('tasks-tbody');

        if (!data.tasks || !data.tasks.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No tasks found.</td></tr>';
          return;
        }

        tbody.innerHTML = data.tasks.map(t => `
          <tr>
            <td><strong>Week ${t.week}</strong></td>
            <td><span style="font-size: 12px; font-weight: 700; color: #0066CC;">${t.track.toUpperCase()}</span></td>
            <td>
              <div style="font-weight: 600;">${t.title}</div>
              <div style="font-size: 13px; color: #6B7280; margin-top: 2px;">${t.description}</div>
            </td>
            <td>${t.duration}</td>
            <td><strong>${t.points} pts</strong></td>
            <td>
              <button class="btn-action-sm" onclick="archiveTask('${t.id}')" style="color: #DC2626;">Archive</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function openCreateModal() {
      document.getElementById('modal-title').textContent = "Add New Milestone Task";
      document.getElementById('edit-task-id').value = "";
      document.getElementById('modal-task-title').value = "";
      document.getElementById('modal-desc').value = "";
      document.getElementById('task-modal').style.display = "flex";
    }

    function closeModal() {
      document.getElementById('task-modal').style.display = "none";
    }

    async function saveTask() {
      const track = document.getElementById('modal-track').value;
      const week = document.getElementById('modal-week').value;
      const duration = document.getElementById('modal-duration').value;
      const title = document.getElementById('modal-task-title').value.trim();
      const description = document.getElementById('modal-desc').value.trim();
      const points = document.getElementById('modal-points').value;

      if (!title || !description) return alert("Title and description are required.");

      try {
        const res = await fetch("/api/admin/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ track, week, duration, title, description, points })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.error || "Failed to save task.");

        closeModal();
        loadTasks();
      } catch (err) {
        alert("Network error saving task.");
      }
    }

    async function archiveTask(taskId) {
      if (!confirm("Are you sure you want to archive this task?")) return;
      try {
        await fetch(`/api/admin/tasks/${taskId}`, { method: "DELETE" });
        loadTasks();
      } catch (err) {
        alert("Failed to archive task.");
      }
    }

    window.addEventListener("load", loadTasks);
  </script>
</body>
</html>
