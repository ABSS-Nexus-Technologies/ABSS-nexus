<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#00c2ff" />
      <stop offset="50%" stopColor="#0066cc" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>

    <!-- Glowing cyan gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#00c2ff" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>

    <!-- Top Text Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#cbd5e1" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group 1: Geometric Nexus Logo Mark -->
  <g transform="translate(15, 12)">
    <!-- Outer rounded squircle -->
    <rect x="0" y="0" width="66" height="66" rx="16" fill="#090d18" stroke="rgba(0, 194, 255, 0.4)" stroke-width="1.5" />
    
    <!-- Central Connected Nexus Hexagram/Circuit -->
    <path d="M33 14 L49 23 L49 43 L33 52 L17 43 L17 23 Z" stroke="url(#iconBg)" stroke-width="2.5" stroke-linejoin="round" fill="none" />
    <path d="M33 14 L33 33 L49 43" stroke="url(#cyanGrad)" stroke-width="2" stroke-linejoin="round" />
    <path d="M33 33 L17 43" stroke="#8b5cf6" stroke-width="2" stroke-linejoin="round" />

    <!-- Core Nexus Nodes -->
    <circle cx="33" cy="33" r="4.5" fill="#00c2ff" filter="url(#iconGlow)" />
    <circle cx="33" cy="14" r="3" fill="#ffffff" />
    <circle cx="49" cy="23" r="3" fill="#00c2ff" />
    <circle cx="49" cy="43" r="3" fill="#8b5cf6" />
    <circle cx="33" cy="52" r="3" fill="#00c2ff" />
    <circle cx="17" cy="43" r="3" fill="#8b5cf6" />
    <circle cx="17" cy="23" r="3" fill="#00c2ff" />
  </g>

  <!-- Group 2: Typography Stack -->
  <g transform="translate(98, 0)">
    <!-- Line 1: Main Brand Name (ABSS NEXUS) -->
    <text x="0" y="44" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.02em">
      ABSS NEXUS
    </text>

    <!-- Line 2: Descriptor (TECHNOLOGIES) -->
    <text x="2" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#00c2ff" letter-spacing="0.32em">
      TECHNOLOGIES
    </text>
  </g>
</svg>
